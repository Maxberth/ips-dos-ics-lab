#!/usr/sbin/nft -f
# lab-ips en modo "solo router" (E1): reenvía entre v20 y v30 sin inspección, con contadores.
flush ruleset
table inet ips {
  counter c_fwd_v20_v30 { }
  counter c_fwd_v30_v20 { }
  chain forward {
    type filter hook forward priority filter; policy drop;
    iifname "v20" oifname "v30" counter name c_fwd_v20_v30 accept
    iifname "v30" oifname "v20" counter name c_fwd_v30_v20 accept
  }
  chain input {
    type filter hook input priority filter; policy accept;
  }
}
