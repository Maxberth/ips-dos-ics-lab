#!/usr/sbin/nft -f
# lab-ips en modo en línea (E2/E3/E4): todo lo enrutado entre v20 y v30 va a las colas NFQUEUE 0-1
# con reparto por hash de flujo (sin "fanout", que reparte por CPU), una cola por vCPU del IPS (D18).
# SIN "bypass": si Suricata no está escuchando la cola, el tráfico se corta (fail-closed). Ver D11.
# La ruta y las interfaces son idénticas al modo router; solo cambia la acción (obs. 10).
flush ruleset
include "/etc/nftables.d/mgmt-guard.nft"
table inet ips {
  counter c_fwd_v20_v30 { }
  counter c_fwd_v30_v20 { }
  chain forward {
    type filter hook forward priority filter; policy drop;
    iifname "v20" oifname "v30" counter name c_fwd_v20_v30 queue num 0-1
    iifname "v30" oifname "v20" counter name c_fwd_v30_v20 queue num 0-1
  }
  chain input {
    type filter hook input priority filter; policy accept;
  }
}
