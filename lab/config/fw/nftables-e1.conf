#!/usr/sbin/nft -f
# Firewall/router lab-fw (Debian 13 + nftables). Política E1 "solo firewall/VLAN".
# v10 = VLAN 10 (IT/atacante, 192.168.10.1)   v20 = VLAN 20 (DMZ, 192.168.20.1)   mgmt = VLAN 99
# Permite desde VLAN 10 solo lo que usa el experimento y NO limita la tasa.
# Cada regla tiene contador con nombre para leerla como tercera fuente:  nft -j list counters
flush ruleset

table inet fw {
  counter c_fwd_est        { }
  counter c_v10_plc_tcp502 { }
  counter c_v10_plc_udp    { }
  counter c_v10_plc_icmp   { }
  counter c_v10_scada_udp  { }
  counter c_v10_to_mgmt    { }
  counter c_fwd_drop       { }
  counter c_in_drop        { }

  chain input {
    type filter hook input priority filter; policy drop;
    iif lo accept
    ct state established,related accept
    iifname "mgmt" tcp dport 22 accept
    iifname "mgmt" icmp type echo-request accept
    iifname { "v10", "v20" } icmp type echo-request accept
    iifname "v10" ip daddr 192.168.99.0/24 counter name c_v10_to_mgmt drop
    counter name c_in_drop drop
  }

  chain forward {
    type filter hook forward priority filter; policy drop;
    ct state established,related counter name c_fwd_est accept
    iifname "v10" oifname "v20" ip daddr 192.168.30.10 tcp dport 502 counter name c_v10_plc_tcp502 accept
    iifname "v10" oifname "v20" ip daddr 192.168.30.10 meta l4proto udp counter name c_v10_plc_udp accept
    iifname "v10" oifname "v20" ip daddr 192.168.30.10 icmp type echo-request counter name c_v10_plc_icmp accept
    iifname "v10" oifname "v20" ip daddr 192.168.20.20 meta l4proto udp counter name c_v10_scada_udp accept
    iifname "v20" oifname "v10" ip saddr 192.168.30.10 icmp type echo-reply accept
    iifname "v10" ip daddr 192.168.99.0/24 counter name c_v10_to_mgmt drop
    counter name c_fwd_drop drop
  }
}
